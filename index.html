<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Media Pembelajaran Suhu dan Kalor - 3 Pertemuan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#020617;color:#e2e8f0}*{box-sizing:border-box}.glass{background:rgba(15,23,42,.82);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.18)}.card{background:rgba(15,23,42,.72);border:1px solid rgba(100,116,139,.3)}.section{display:none}.section.active{display:block}.page{min-height:calc(100vh - 64px)}button,input,select,textarea{font:inherit}.sim-canvas{position:relative;height:calc(100vh - 64px);min-height:620px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#172554,#020617 65%)}#threeCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.control-panel{position:absolute;z-index:5;left:16px;right:16px;bottom:16px;max-width:1100px;margin:auto}.thermo-wrap{height:260px;display:flex;justify-content:center;align-items:end;gap:30px}.thermo{width:44px;height:220px;border:5px solid #cbd5e1;border-radius:24px;position:relative;background:rgba(255,255,255,.08)}.thermo-fill{position:absolute;bottom:0;left:5px;right:5px;background:linear-gradient(to top,#3b82f6,#f59e0b,#ef4444);border-radius:16px;height:25%;transition:height .2s}.thermo-bulb{width:65px;height:65px;border-radius:50%;background:#ef4444;position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);box-shadow:0 0 25px rgba(239,68,68,.5)}.scale-label{display:flex;flex-direction:column;justify-content:space-between;height:220px;font-size:11px;color:#94a3b8}.heat-rod{height:32px;border-radius:16px;background:linear-gradient(90deg,#3b82f6,#f59e0b,#ef4444);position:relative;overflow:hidden}.heat-particle{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9;animation:moveHeat 2s linear infinite}@keyframes moveHeat{from{left:-10px}to{left:100%}}.waterbox{width:280px;height:220px;border:3px solid #94a3b8;border-radius:10px;position:relative;overflow:hidden;background:rgba(59,130,246,.15)}.water{position:absolute;inset:auto 0 0;height:70%;background:rgba(59,130,246,.35)}.conv{position:absolute;width:16px;height:16px;border-radius:50%;background:#f59e0b;box-shadow:0 0 10px #f59e0b}.conv.a{left:20%;bottom:20%;animation:up 3s infinite}.conv.b{left:65%;bottom:25%;animation:up2 3.4s infinite}.conv.c{left:45%;bottom:60%;animation:down 3.1s infinite}@keyframes up{50%{bottom:75%;left:35%}100%{bottom:20%;left:20%}}@keyframes up2{50%{bottom:80%;left:75%}100%{bottom:25%;left:65%}}@keyframes down{50%{bottom:20%;left:55%}100%{bottom:60%;left:45%}}.radiation-source{width:95px;height:95px;border-radius:50%;background:radial-gradient(circle,#fff 2%,#fde047 20%,#f97316 50%,#ef4444 75%,transparent 76%);box-shadow:0 0 45px #f97316}.ray{height:3px;width:180px;background:linear-gradient(90deg,#f59e0b,transparent);transform-origin:left center;animation:pulseRay 1.4s infinite}@keyframes pulseRay{50%{opacity:.25;transform:scaleX(.65)}}.fade{animation:fade .5s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#475569;border-radius:8px}
</style>
</head>
<body>
<header class="sticky top-0 z-50 glass h-16">
<div class="max-w-7xl mx-auto h-full px-4 flex items-center justify-between gap-3">
<div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-blue-600 flex items-center justify-center"><i class="fa-solid fa-temperature-half"></i></div><div class="min-w-0"><h1 class="font-black text-sm md:text-lg truncate">Suhu dan Kalor</h1><p class="text-[10px] md:text-xs text-slate-400 truncate">Media Pembelajaran Interaktif • 3 Pertemuan</p></div></div>
<button type="button" id="btnHome" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold"><i class="fa-solid fa-house mr-1"></i>Beranda</button>
</div></header>
<main>
<!-- HOME -->
<section id="home" class="section active page p-5 md:p-10"><div class="max-w-7xl mx-auto">
<div class="rounded-3xl p-7 md:p-10 bg-gradient-to-br from-blue-950 via-slate-900 to-amber-950 border border-slate-700 shadow-2xl mb-8"><span class="text-xs uppercase tracking-[.2em] text-blue-300 font-bold">Modul Interaktif Fisika</span><h2 class="text-3xl md:text-5xl font-black mt-2">Suhu dan Kalor</h2><p class="text-slate-300 mt-3 max-w-3xl leading-relaxed">Media pembelajaran berbasis web untuk tiga pertemuan: Suhu, Kalor, dan Perpindahan Kalor. Pilih pertemuan sesuai tahapan pembelajaran.</p></div>
<div class="grid md:grid-cols-3 gap-5">
<button type="button" id="btnMeeting1" class="card rounded-3xl p-6 text-left cursor-pointer hover:border-blue-400 hover:-translate-y-1 transition w-full"><div class="w-14 h-14 rounded-2xl bg-blue-500/20 text-blue-300 flex items-center justify-center text-2xl mb-5"><i class="fa-solid fa-temperature-half"></i></div><span class="text-xs font-bold text-blue-300">PERTEMUAN 1</span><h3 class="text-2xl font-black mt-1">Suhu</h3><p class="text-sm text-slate-400 mt-2">Mengenal konsep suhu, kesetimbangan termal, termometer, skala suhu, dan konversi suhu.</p><span class="mt-5 block w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-center">Mulai Pertemuan 1</span></button>
<button type="button" id="btnMeeting2" class="card rounded-3xl p-6 text-left cursor-pointer hover:border-amber-400 hover:-translate-y-1 transition w-full"><div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-2xl mb-5"><i class="fa-solid fa-fire"></i></div><span class="text-xs font-bold text-amber-300">PERTEMUAN 2</span><h3 class="text-2xl font-black mt-1">Kalor</h3><p class="text-sm text-slate-400 mt-2">Menganalisis hubungan kalor, massa, kalor jenis, perubahan suhu, dan waktu pemanasan melalui simulasi.</p><span class="mt-5 block w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-500 font-bold text-center">Mulai Pertemuan 2</span></button>
<button type="button" id="btnMeeting3" class="card rounded-3xl p-6 text-left cursor-pointer hover:border-rose-400 hover:-translate-y-1 transition w-full"><div class="w-14 h-14 rounded-2xl bg-rose-500/20 text-rose-300 flex items-center justify-center text-2xl mb-5"><i class="fa-solid fa-arrows-left-right-to-line"></i></div><span class="text-xs font-bold text-rose-300">PERTEMUAN 3</span><h3 class="text-2xl font-black mt-1">Perpindahan Kalor</h3><p class="text-sm text-slate-400 mt-2">Mengeksplorasi konduksi, konveksi, dan radiasi serta penerapannya dalam kehidupan sehari-hari.</p><span class="mt-5 block w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold text-center">Mulai Pertemuan 3</span></button>
</div>
</div></section>

<!-- MEETING LAYOUTS -->
<section id="meeting1" class="section page"><div class="max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-4"><button onclick="m1('materi')" class="navbtn">Materi</button><button onclick="m1('sim')" class="navbtn">Simulasi Suhu</button><button onclick="m1('lkpd')" class="navbtn">LKPD</button><button onclick="m1('eval')" class="navbtn">Evaluasi</button></div>
<div id="m1-materi" class="mcontent card rounded-3xl p-6 md:p-8"></div><div id="m1-sim" class="mcontent hidden"></div><div id="m1-lkpd" class="mcontent hidden"></div><div id="m1-eval" class="mcontent hidden"></div></div></section>
<section id="meeting2" class="section page"><div class="max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-4"><button onclick="m2('materi')" class="navbtn">Materi</button><button onclick="m2('sim')" class="navbtn">Simulasi Kalor</button><button onclick="m2('data')" class="navbtn">Pengamatan</button><button onclick="m2('lkpd')" class="navbtn">LKPD</button><button onclick="m2('eval')" class="navbtn">Evaluasi</button></div>
<div id="m2-materi" class="mcontent card rounded-3xl p-6 md:p-8"></div><div id="m2-sim" class="mcontent hidden"></div><div id="m2-data" class="mcontent hidden"></div><div id="m2-lkpd" class="mcontent hidden"></div><div id="m2-eval" class="mcontent hidden"></div></div></section>
<section id="meeting3" class="section page"><div class="max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-4"><button onclick="m3('materi')" class="navbtn">Materi</button><button onclick="m3('sim')" class="navbtn">Simulasi</button><button onclick="m3('lkpd')" class="navbtn">LKPD</button><button onclick="m3('eval')" class="navbtn">Evaluasi</button></div>
<div id="m3-materi" class="mcontent card rounded-3xl p-6 md:p-8"></div><div id="m3-sim" class="mcontent hidden"></div><div id="m3-lkpd" class="mcontent hidden"></div><div id="m3-eval" class="mcontent hidden"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const navStyle=`px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-xs md:text-sm font-bold border border-slate-700 transition`;
document.querySelectorAll('.navbtn').forEach(b=>b.className=navStyle);
function show(id){const target=$(id);if(!target)return;document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));target.classList.add('active');window.scrollTo({top:0,behavior:'auto'});if(typeof renderMath==='function')renderMath();}
function goHome(){show('home')}
function openMeeting(n){const id='meeting'+Number(n);show(id);if(Number(n)===1)m1('materi');if(Number(n)===2)m2('materi');if(Number(n)===3)m3('materi')}
window.goHome=goHome;window.openMeeting=openMeeting;
function renderMath(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function tabs(prefix,key){document.querySelectorAll(`[id^="${prefix}-"]`).forEach(x=>{if(x.id===prefix+'-'+key)x.classList.remove('hidden');else x.classList.add('hidden')});renderMath()}

// MEETING 1
function m1(k){tabs('m1',k)}
$('m1-materi').innerHTML=`<div class="flex items-center gap-4 mb-7"><div class="w-14 h-14 rounded-2xl bg-blue-500/20 text-blue-300 flex items-center justify-center text-2xl"><i class="fa-solid fa-temperature-half"></i></div><div><span class="text-xs font-bold text-blue-300">PERTEMUAN 1</span><h2 class="text-3xl font-black">Suhu</h2></div></div><div class="grid md:grid-cols-2 gap-5"><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg mb-2">Konsep Suhu</h3><p class="text-sm text-slate-300 leading-relaxed">Suhu menyatakan derajat panas atau dingin suatu benda dan berkaitan dengan keadaan termal benda. Pengukuran suhu dilakukan menggunakan termometer.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg mb-2">Kesetimbangan Termal</h3><p class="text-sm text-slate-300 leading-relaxed">Ketika dua benda bersentuhan dan akhirnya memiliki suhu yang sama, keduanya berada dalam kesetimbangan termal.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg mb-2">Skala Suhu</h3><p class="text-sm text-slate-300 leading-relaxed">Media menyediakan Celsius, Kelvin, dan Fahrenheit. Hubungan yang digunakan antara lain $T_K=T_C+273.15$ dan $T_F=\frac{9}{5}T_C+32$.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg mb-2">Tujuan Pembelajaran</h3><ul class="list-disc ml-5 text-sm text-slate-300 space-y-1"><li>Menjelaskan konsep suhu.</li><li>Mengidentifikasi fungsi termometer.</li><li>Mengonversi skala suhu.</li><li>Menganalisis perubahan suhu berdasarkan hasil simulasi.</li></ul></article></div>`;
$('m1-sim').innerHTML=`<div class="sim-canvas rounded-3xl overflow-hidden"><div class="absolute z-10 top-4 left-4 right-4 flex justify-between gap-3"><div class="glass rounded-2xl p-4"><span class="text-xs text-blue-300 font-bold">SIMULASI SUHU</span><div class="text-3xl font-black"><span id="sTemp">25.0</span> °C</div><div class="text-xs text-slate-400" id="sConv">298.15 K • 77.0 °F</div></div><button onclick="resetTemp()" class="glass h-fit px-4 py-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-rotate-left mr-1"></i>Reset</button></div><div class="absolute inset-0 flex items-center justify-center pt-8"><div class="thermo-wrap"><div class="scale-label"><span>100°C</span><span>75°C</span><span>50°C</span><span>25°C</span><span>0°C</span></div><div class="thermo"><div id="thermoFill" class="thermo-fill"></div><div class="thermo-bulb"></div></div><div class="w-64"><label class="text-sm font-bold">Atur suhu benda</label><input id="tempSlider" type="range" min="0" max="100" value="25" step="0.5" class="w-full mt-3 accent-blue-500" oninput="updateTemp(this.value)"><div class="flex justify-between text-xs text-slate-400"><span>0°C</span><span>50°C</span><span>100°C</span></div><div class="mt-6 glass rounded-2xl p-4 text-xs text-slate-300"><b class="text-white">Amati:</b> bagaimana posisi kolom termometer berubah ketika suhu dinaikkan atau diturunkan?</div></div></div></div></div>`;
$('m1-lkpd').innerHTML=`<div class="card rounded-3xl p-6 md:p-8"><span class="text-xs font-bold text-blue-300">LKPD PERTEMUAN 1</span><h2 class="text-2xl font-black mt-1 mb-6">Menyelidiki Suhu dan Skala Termometer</h2><label class="text-xs text-slate-400">Nama / Kelompok</label><input class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mt-1 mb-5" placeholder="Tulis nama..."><div class="space-y-5 text-sm"><div><b>1.</b> Atur suhu pada 20°C, 40°C, 60°C, dan 80°C. Catat hasil konversinya ke Kelvin dan Fahrenheit.</div><table class="w-full text-xs border border-slate-700"><tr class="bg-slate-800"><th class="p-3">Suhu °C</th><th class="p-3">Kelvin</th><th class="p-3">Fahrenheit</th></tr>${[20,40,60,80].map(x=>`<tr><td class="p-3 border-t border-slate-700">${x}</td><td class="p-3 border-t border-slate-700"></td><td class="p-3 border-t border-slate-700"></td></tr>`).join('')}</table><div><b>2.</b> Jelaskan perbedaan antara suhu dan kalor.<textarea class="w-full mt-2 bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea></div><div><b>3.</b> Apa yang terjadi pada pembacaan termometer ketika suhu dinaikkan? Jelaskan berdasarkan hasil simulasi.<textarea class="w-full mt-2 bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea></div><div><b>4. Kesimpulan</b><textarea class="w-full mt-2 bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea></div></div></div>`;
$('m1-eval').innerHTML=quiz(1,[['Suhu suatu benda menunjukkan ...','derajat panas atau dingin benda'],['Alat untuk mengukur suhu adalah ...','termometer'],['Rumus Celsius ke Kelvin adalah ...','T_K = T_C + 273.15'],['Suhu 0°C setara dengan ... K','273.15']]);
function updateTemp(v){v=+v;$('sTemp').textContent=v.toFixed(1);$('sConv').textContent=(v+273.15).toFixed(2)+' K • '+(v*9/5+32).toFixed(1)+' °F';$('thermoFill').style.height=Math.max(3,v)+'%'}function resetTemp(){$('tempSlider').value=25;updateTemp(25)}

// MEETING 2
let heatLogs=[];let heatState={mat:'water',m:.5,p:500,T:25,Q:0,t:0,run:false};const mats={water:['Air',4184],aluminum:['Aluminium',900],copper:['Tembaga',385],iron:['Besi',450],gold:['Emas',129],lead:['Timbal',128]};
function m2(k){tabs('m2',k);if(k==='sim')renderHeatSim();if(k==='data')renderHeatData()}
$('m2-materi').innerHTML=`<div class="flex items-center gap-4 mb-7"><div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-2xl"><i class="fa-solid fa-fire"></i></div><div><span class="text-xs font-bold text-amber-300">PERTEMUAN 2</span><h2 class="text-3xl font-black">Kalor</h2></div></div><div class="grid md:grid-cols-2 gap-5"><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Pengertian Kalor</h3><p class="text-sm text-slate-300 mt-2 leading-relaxed">Kalor merupakan energi yang berpindah akibat perbedaan suhu. Dalam simulasi, energi dari pemanas digunakan untuk meningkatkan energi termal benda.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Persamaan Kalor</h3><p class="text-sm text-slate-300 mt-2">Untuk perubahan suhu: $Q=m c \Delta T$. Semakin besar massa atau kalor jenis, semakin besar kalor yang diperlukan untuk perubahan suhu yang sama.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Pemanasan</h3><p class="text-sm text-slate-300 mt-2">Dengan daya pemanas $P$, energi yang diberikan selama waktu $t$ dapat dimodelkan sebagai $Q=P t$ pada simulasi sederhana ini.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Tujuan Pembelajaran</h3><ul class="list-disc ml-5 text-sm text-slate-300 space-y-1"><li>Menganalisis hubungan $Q$, $m$, $c$, dan $\Delta T$.</li><li>Membandingkan respons bahan berbeda.</li><li>Mengumpulkan dan menganalisis data simulasi.</li></ul></article></div>`;
$('m2-sim').innerHTML=`<div id="heatMount"></div>`;
$('m2-data').innerHTML=`<div id="heatDataMount"></div>`;
function renderHeatSim(){$('heatMount').innerHTML=`<div class="sim-canvas rounded-3xl overflow-hidden"><div class="absolute inset-0" id="heatVisual"><div class="absolute left-1/2 top-1/3 -translate-x-1/2"><div class="waterbox"><div class="water"></div><div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-2 h-28 bg-slate-200 rounded"></div></div><div class="w-32 h-4 bg-slate-500 rounded-full mx-auto mt-2"></div><div class="w-16 h-20 bg-slate-600 rounded-b-xl mx-auto relative"><div id="flame" class="absolute -top-12 left-1/2 -translate-x-1/2 text-4xl">🔥</div></div></div></div><div class="absolute z-10 top-4 left-4 glass rounded-2xl p-4"><span class="text-xs text-slate-400">SUHU BENDA</span><div class="text-3xl font-black"><span id="hTemp">25.0</span> °C</div><div class="text-xs text-amber-300">Q = <span id="hQ">0</span> J</div><div class="text-xs text-slate-400">t = <span id="hTime">0.0</span> s</div></div><div class="absolute z-10 bottom-4 left-4 right-4 control-panel"><div class="glass rounded-3xl p-4 grid sm:grid-cols-2 lg:grid-cols-4 gap-3"><label class="text-xs font-bold">Bahan<select id="hMat" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2" onchange="heatReset()">${Object.entries(mats).map(([k,v])=>`<option value="${k}">${v[0]} (c=${v[1]})</option>`).join('')}</select></label><label class="text-xs font-bold">Massa <span id="hmVal">0.50 kg</span><input id="hm" type="range" min="0.1" max="2" step=".05" value=".5" class="w-full accent-indigo-500" oninput="heatMass(this.value)"></label><label class="text-xs font-bold">Daya <span id="hpVal">500 W</span><input id="hp" type="range" min="0" max="2000" step="100" value="500" class="w-full accent-rose-500" oninput="heatPower(this.value)"></label><div class="grid grid-cols-2 gap-2"><button onclick="heatToggle()" id="hStart" class="rounded-xl bg-emerald-600 font-bold text-xs">Mulai</button><button onclick="heatReset()" class="rounded-xl bg-slate-700 font-bold text-xs">Reset</button></div></div><div class="glass rounded-2xl mt-3 p-3 flex justify-between items-center"><div class="text-xs text-slate-300">Kalor jenis: <b id="hcVal">4184 J/kg°C</b></div><button onclick="recordHeat()" class="px-4 py-2 rounded-xl bg-blue-600 font-bold text-xs">+ Catat Data</button></div></div></div>`;heatReset()}
let lastHeat=performance.now();function heatLoop(now){let dt=Math.min((now-lastHeat)/1000,.1);lastHeat=now;if(heatState.run&&heatState.p>0){heatState.t+=dt;heatState.Q+=heatState.p*dt;heatState.T+=heatState.p*dt/(heatState.m*mats[heatState.mat][1]);if(heatState.mat==='water')heatState.T=Math.min(100,heatState.T);heatUI()}requestAnimationFrame(heatLoop)}requestAnimationFrame(heatLoop);
function heatUI(){if(!$('hTemp'))return;$('hTemp').textContent=heatState.T.toFixed(1);$('hQ').textContent=heatState.Q.toFixed(0);$('hTime').textContent=heatState.t.toFixed(1);$('hcVal').textContent=mats[heatState.mat][1]+' J/kg°C';$('hStart').textContent=heatState.run?'Hentikan':'Mulai';$('flame').style.opacity=heatState.run&&heatState.p>0?'1':'.15'}function heatToggle(){heatState.run=!heatState.run;heatUI()}function heatReset(){heatState={mat:$('hMat')?.value||'water',m:+$('hm')?.value||.5,p:+$('hp')?.value||500,T:25,Q:0,t:0,run:false};if($('hmVal'))$('hmVal').textContent=heatState.m.toFixed(2)+' kg';if($('hpVal'))$('hpVal').textContent=heatState.p+' W';heatUI()}function heatMass(v){heatState.m=+v;$('hmVal').textContent=heatState.m.toFixed(2)+' kg';heatReset()}function heatPower(v){heatState.p=+v;$('hpVal').textContent=heatState.p+' W'}function recordHeat(){heatLogs.push({material:mats[heatState.mat][0],c:mats[heatState.mat][1],m:heatState.m,t:heatState.t,T0:25,T1:heatState.T,dT:heatState.T-25,Q:heatState.Q});renderHeatData()}
function renderHeatData(){$('heatDataMount').innerHTML=`<div class="card rounded-3xl p-5 overflow-auto"><div class="flex justify-between items-center mb-4"><div><span class="text-xs text-amber-300 font-bold">DATA PENGAMATAN</span><h2 class="text-xl font-black">Hasil Simulasi Kalor</h2></div><button onclick="heatLogs=[];renderHeatData()" class="px-3 py-2 bg-rose-600 rounded-xl text-xs font-bold">Hapus</button></div><table class="w-full text-xs"><thead><tr class="bg-slate-800">${['No','Bahan','c','m','t','T0','T1','ΔT','Q'].map(x=>`<th class="p-3 text-left">${x}</th>`).join('')}</tr></thead><tbody>${heatLogs.length?heatLogs.map((x,i)=>`<tr class="border-t border-slate-700"><td class="p-3">${i+1}</td><td class="p-3">${x.material}</td><td class="p-3">${x.c}</td><td class="p-3">${x.m.toFixed(2)}</td><td class="p-3">${x.t.toFixed(1)}</td><td class="p-3">${x.T0.toFixed(1)}</td><td class="p-3">${x.T1.toFixed(1)}</td><td class="p-3">${x.dT.toFixed(1)}</td><td class="p-3">${x.Q.toFixed(0)}</td></tr>`).join(''):`<tr><td colspan="9" class="p-8 text-center text-slate-500">Belum ada data. Jalankan simulasi lalu klik Catat Data.</td></tr>`}</tbody></table></div>`}
$('m2-lkpd').innerHTML=`<div class="card rounded-3xl p-6"><span class="text-xs text-amber-300 font-bold">LKPD PERTEMUAN 2</span><h2 class="text-2xl font-black mb-6">Menyelidiki Kalor Jenis</h2><div class="space-y-5 text-sm"><p><b>1.</b> Buat hipotesis: dengan massa dan daya pemanas sama, bahan manakah yang mengalami kenaikan suhu lebih cepat?</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea><p><b>2.</b> Bandingkan Air dan Tembaga dengan massa 0,5 kg dan daya 1000 W. Catat data dari simulasi.</p><p><b>3.</b> Jelaskan mengapa bahan dengan kalor jenis lebih kecil cenderung mengalami kenaikan suhu lebih besar untuk kalor yang sama menggunakan $Q=mc\Delta T$.</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="4"></textarea><p><b>4.</b> Bagaimana pengaruh massa terhadap perubahan suhu jika kalor yang diberikan sama?</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea><p><b>5. Kesimpulan</b></p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea></div></div>`;

function renderTransferSim(){$('transferMount').innerHTML=`<div class="card rounded-3xl p-5"><div class="flex flex-wrap gap-2 mb-5"><button onclick="transferMode('konduksi')" class="tm px-4 py-2 rounded-xl bg-blue-600 text-xs font-bold">Konduksi</button><button onclick="transferMode('konveksi')" class="tm px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">Konveksi</button><button onclick="transferMode('radiasi')" class="tm px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">Radiasi</button></div><div id="transferVisual" class="min-h-[420px] rounded-3xl bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden"></div><div id="transferText" class="mt-4 p-4 rounded-2xl bg-slate-800/70 text-sm text-slate-300"></div></div>`;transferMode('konduksi')}
function transferMode(mode){const v=$('transferVisual'),t=$('transferText');if(!v)return;document.querySelectorAll('.tm').forEach(b=>b.className='tm px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold');const idx=['konduksi','konveksi','radiasi'].indexOf(mode);document.querySelectorAll('.tm')[idx].className='tm px-4 py-2 rounded-xl bg-rose-600 text-xs font-bold';if(mode==='konduksi'){v.innerHTML='<div class="w-4/5 max-w-2xl"><div class="flex justify-center mb-6"><div class="w-20 h-20 rounded-full bg-gradient-to-br from-yellow-300 to-red-600 shadow-[0_0_60px_rgba(249,115,22,.6)]"></div></div><div class="heat-rod">'+Array.from({length:9},(_,i)=>`<span class="heat-particle" style="animation-delay:${i*.2}s"></span>`).join('')+'</div><div class="flex justify-between text-xs text-slate-500 mt-2"><span>Ujung panas</span><span>Ujung lebih dingin</span></div></div>';t.innerHTML='<b class="text-white">Konduksi:</b> energi termal berpindah sepanjang bahan dari bagian bersuhu lebih tinggi ke bagian bersuhu lebih rendah.'}else if(mode==='konveksi'){v.innerHTML='<div><div class="waterbox"><div class="water"></div><div class="conv a"></div><div class="conv b"></div><div class="conv c"></div></div><div class="text-center mt-4 text-xs text-slate-400">Arus fluida bergerak membentuk sirkulasi</div></div>';t.innerHTML='<b class="text-white">Konveksi:</b> pemanasan menghasilkan gerak fluida sehingga energi termal terbawa oleh aliran zat.'}else{v.innerHTML=`<div class="flex items-center gap-6 md:gap-12"><div class="radiation-source"></div><div class="space-y-5">${[0,25,50].map((x,i)=>`<div class="ray" style="width:${180+i*45}px;animation-delay:${i*.25}s"></div>`).join('')}</div><div class="w-24 h-40 rounded-2xl bg-slate-700 border border-slate-500"></div></div>`;t.innerHTML='<b class="text-white">Radiasi:</b> energi termal dipancarkan dan dapat berpindah melalui gelombang elektromagnetik tanpa kontak langsung.'}}
$('m3-lkpd').innerHTML=`<div class="card rounded-3xl p-6"><span class="text-xs text-rose-300 font-bold">LKPD PERTEMUAN 3</span><h2 class="text-2xl font-black mb-6">Mengidentifikasi Perpindahan Kalor</h2><div class="space-y-5 text-sm"><p><b>1.</b> Amati ketiga mode simulasi. Tuliskan ciri utama konduksi, konveksi, dan radiasi.</p><table class="w-full text-xs border border-slate-700"><tr class="bg-slate-800"><th class="p-3">Mekanisme</th><th class="p-3">Ciri yang diamati</th><th class="p-3">Contoh sehari-hari</th></tr>${['Konduksi','Konveksi','Radiasi'].map(x=>`<tr><td class="p-3 border-t border-slate-700 font-bold">${x}</td><td class="p-3 border-t border-slate-700"></td><td class="p-3 border-t border-slate-700"></td></tr>`).join('')}</table><p><b>2.</b> Mengapa gagang sendok logam dapat menjadi panas ketika ujung lainnya dimasukkan ke dalam minuman panas?</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea><p><b>3.</b> Mengapa air dalam panci dapat mengalami gerakan naik-turun ketika dipanaskan?</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea><p><b>4.</b> Jelaskan mengapa panas Matahari dapat sampai ke Bumi.</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea><p><b>5. Kesimpulan</b></p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="3"></textarea></div></div>`;

function quiz(n,qs){return `<div class="card rounded-3xl p-6"><span class="text-xs font-bold text-emerald-300">EVALUASI PERTEMUAN ${n}</span><h2 class="text-2xl font-black mt-1 mb-6">Cek Pemahaman</h2><div class="space-y-5">${qs.map((q,i)=>`<div><p class="text-sm font-semibold">${i+1}. ${q[0]}</p><input data-answer="${esc(q[1])}" class="quizinput w-full mt-2 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm" placeholder="Tulis jawaban..."></div>`).join('')}</div><button onclick="checkQuiz(this)" class="mt-6 px-5 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm">Periksa Jawaban</button><div class="quizresult mt-4 text-sm"></div></div>`}
function checkQuiz(btn){let box=btn.parentElement,inputs=box.querySelectorAll('.quizinput'),score=0;inputs.forEach(i=>{let a=i.value.toLowerCase().replace(/[^a-z0-9=+Δ_ .]/g,'').trim(),key=i.dataset.answer.toLowerCase();if(a&&key.split(' ').some(w=>w.length>3&&a.includes(w))){score++}});box.querySelector('.quizresult').innerHTML=`<b>Hasil: ${score}/${inputs.length}</b><br><span class="text-slate-400">Gunakan hasil ini sebagai umpan balik dan periksa kembali konsep pada materi.</span>`}
